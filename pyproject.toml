[project]
name = "purged-cv"
version = "0.1.0"
description = "Purged cross-validation for stock-return models with overlapping labels: splitters that keep the test period out of training, the leak shown on known-truth data, and the purge size quant-style models need, with a live in-browser lab."
readme = "README.md"
license = "MIT"
authors = [{ name = "Dhirajdas18" }]
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
pcv = "pcv.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pcv"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
